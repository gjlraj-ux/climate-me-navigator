<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate M&E Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a17;
  --ink-soft: #3d3d38;
  --ink-muted: #6b6b63;
  --ink-ghost: #9d9d93;
  --paper: #fbf9f4;
  --paper-warm: #f4f0e6;
  --paper-shade: #efeadb;
  --rule: #d9d4c5;
  --rule-soft: #e8e3d4;
  --accent: #c7570f;        /* GIZ-like orange for headings */
  --accent-deep: #8a3b09;
  --accent-wash: #f7e6d4;
  --strong: #3d6b3f;
  --strong-wash: #dfe8df;
  --weak: #8f7a4a;
  --weak-wash: #ede5cf;
  --radius: 4px;
  --max-w: 1220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

/* ========== MASTHEAD ========== */
.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.masthead-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 24px 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 32px;
}
.masthead-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.masthead-buttons {
  display: flex;
  gap: 8px;
}
.feedback-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 7px 14px;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s;
}
.feedback-btn:hover {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.feedback-btn-icon {
  font-size: 13px;
  line-height: 1;
}
.wordmark-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.wordmark-title em { font-style: italic; font-weight: 400; color: var(--accent); }
.wordmark-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 4px;
}

/* ========== STAGE NAV ========== */
.stage-nav {
  background: var(--paper-warm);
  border-bottom: 1px solid var(--rule);
  position: sticky;
  top: 0;
  z-index: 10;
}
.stage-nav-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 14px 40px;
  display: flex;
  gap: 0;
  align-items: stretch;
}
.stage-chip {
  flex: 1;
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  padding: 10px 14px;
  font-family: inherit;
  color: var(--ink-muted);
  border-left: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: all 0.15s;
}
.stage-chip:first-child { border-left: none; }
.stage-chip:hover { background: var(--paper); color: var(--ink); }
.stage-chip.active {
  color: var(--ink);
  background: var(--paper);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.stage-chip .mono {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.stage-chip .serif {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.stage-chip .state {
  font-size: 11px;
  color: var(--ink-ghost);
  font-style: italic;
}
.stage-chip.active .state { color: var(--accent); font-style: normal; }
.stage-chip.complete .state { color: var(--strong); font-style: normal; }
.stage-chip.complete .state::before { content: "● "; }

/* ========== STAGE PAGE ========== */
.stage-page {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 40px 40px 32px;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 56px;
}
.stage-page[data-stage="4"] { grid-template-columns: 1fr; }

/* left column: stage card + explanatory */
.stage-intro {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.stage-kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.stage-heading {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.015em;
  color: var(--accent);
}
.stage-heading em { color: var(--ink); font-style: italic; font-weight: 400; }
.stage-intro-body {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-soft);
  max-width: 38ch;
}
.stage-intro-body p { margin-bottom: 12px; }

.stage-box {
  border: 1px dashed var(--ink-ghost);
  padding: 0;
  max-width: 330px;
  margin-top: 8px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  font-size: 12.5px;
  background: var(--paper);
}
.stage-box-header {
  grid-column: 1 / -1;
  background: var(--rule-soft);
  padding: 6px 10px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 1px dashed var(--ink-ghost);
}
.stage-box-header span { padding: 2px 0; }
.stage-box-stage, .stage-box-steps {
  padding: 10px 10px;
  color: var(--ink-soft);
  line-height: 1.55;
}
.stage-box-stage { border-right: 1px dashed var(--ink-ghost); }
.stage-box-steps ol { padding-left: 14px; }
.stage-box-steps li { margin-bottom: 3px; }
.stage-box-steps li.current {
  color: var(--accent);
  font-weight: 500;
}

/* right column: the questions */
.stage-body {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.step-block {
  border-top: 2px solid var(--accent);
  padding-top: 22px;
}
.step-heading {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--accent);
  margin-bottom: 16px;
}
.step-prompt {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink-soft);
  margin-bottom: 18px;
  max-width: 58ch;
}
.step-prompt em { color: var(--ink); font-style: italic; }

/* ========== OPTIONS (chip lists + radio groups) ========== */
.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  max-width: 640px;
}
.options.grid-2 { grid-template-columns: 1fr 1fr; gap: 10px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  background: var(--paper);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
  color: inherit;
  font-size: 14px;
  line-height: 1.5;
  width: 100%;
}
.option:hover { border-color: var(--ink-muted); background: var(--paper-warm); }
.option.selected {
  border-color: var(--accent);
  background: var(--accent-wash);
}
.option-marker {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--rule);
  background: var(--paper);
  margin-top: 2px;
  position: relative;
}
.option.selected .option-marker {
  border-color: var(--accent);
  background: var(--accent);
}
.option.selected .option-marker::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: var(--paper);
  border-radius: 50%;
}
.option[data-kind="check"] .option-marker { border-radius: 3px; }
.option[data-kind="check"].selected .option-marker::after { border-radius: 0; inset: 2px; }

.option-body { flex: 1; }
.option-label {
  font-weight: 500;
  color: var(--ink);
  font-size: 14px;
  letter-spacing: -0.005em;
}
.option-help {
  font-size: 12.5px;
  color: var(--ink-muted);
  line-height: 1.5;
  margin-top: 3px;
}

/* primary/secondary toggle for purpose */
.option-tier {
  display: inline-flex;
  margin-top: 6px;
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.option-tier-btn {
  background: var(--paper);
  border: none;
  padding: 4px 10px;
  color: var(--ink-muted);
  cursor: pointer;
  font-family: inherit;
  font-size: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  border-right: 1px solid var(--rule);
  transition: all 0.15s;
}
.option-tier-btn:last-child { border-right: none; }
.option-tier-btn.on { background: var(--accent); color: var(--paper); }
.option-tier-btn:hover:not(.on) { background: var(--paper-warm); color: var(--ink); }

/* ========== NAVIGATION FOOTER ========== */
.stage-footer {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px 40px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  border-top: 1px solid var(--rule-soft);
  margin-top: 32px;
}
.stage-footer-nav {
  display: flex;
  gap: 8px;
}
.btn {
  font-family: inherit;
  font-size: 13.5px;
  letter-spacing: -0.005em;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--ink-muted); color: var(--ink); background: var(--paper-warm); }
.btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.stage-footer-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* ========== STAGE 4 — CONSTELLATION ========== */
.constellation-header {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 4px 0 24px;
}
.constellation-header .stage-heading { max-width: none; }

.share-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--rule-soft);
}
.share-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 8px 14px;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.share-btn:hover {
  background: var(--paper-warm);
  border-color: var(--ink-muted);
  color: var(--ink);
}
.share-btn-icon {
  font-size: 14px;
  line-height: 1;
}
.share-btn.confirmed {
  background: var(--strong-wash);
  border-color: var(--strong);
  color: var(--strong);
}

/* ===== FEEDBACK DIALOG ===== */
.feedback-dialog-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(26, 26, 23, 0.55);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 20px 20px;
  overflow-y: auto;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.feedback-dialog-panel {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  max-width: 540px;
  width: 100%;
  padding: 28px 32px 26px;
  position: relative;
  box-shadow: 0 12px 40px rgba(26, 26, 23, 0.18);
  max-height: 88vh;
  overflow-y: auto;
}
.feedback-dialog-panel.wide {
  max-width: 760px;
}
.feedback-dialog-close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  font-size: 24px;
  line-height: 1;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius);
}
.feedback-dialog-close:hover { background: var(--paper-warm); color: var(--ink); }
.feedback-dialog-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-bottom: 6px;
}
.feedback-dialog-intro {
  font-size: 13.5px;
  color: var(--ink-muted);
  line-height: 1.55;
  margin-bottom: 20px;
}
.feedback-dialog-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 22px;
}
.feedback-dialog-btn {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  text-decoration: none;
  padding: 11px 16px;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  transition: all 0.15s;
}
.feedback-dialog-btn:hover {
  background: var(--paper-warm);
  border-color: var(--ink-muted);
}
.feedback-dialog-btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.feedback-dialog-btn.primary:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
}
.feedback-dialog-btn-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  font-weight: 400;
}
.feedback-dialog-btn.primary .feedback-dialog-btn-sub {
  color: var(--accent-soft);
}
.feedback-dialog-section {
  border-top: 1px solid var(--rule-soft);
  padding-top: 18px;
}
.feedback-dialog-or {
  font-size: 12.5px;
  color: var(--ink-muted);
  font-style: italic;
  margin-bottom: 12px;
}
.feedback-dialog-field {
  margin-bottom: 14px;
}
.feedback-dialog-field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 5px;
}
.feedback-dialog-copy-row {
  display: flex;
  gap: 6px;
}
.feedback-dialog-copy-row input {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  background: var(--paper-warm);
  color: var(--ink);
}
.feedback-dialog-field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  background: var(--paper-warm);
  color: var(--ink-soft);
  resize: vertical;
  line-height: 1.5;
  margin-bottom: 6px;
}
.feedback-dialog-copy-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 14px;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.feedback-dialog-copy-btn.full { width: 100%; }
.feedback-dialog-copy-btn:hover {
  background: var(--paper-warm);
  border-color: var(--ink-muted);
  color: var(--ink);
}
.feedback-dialog-copy-btn.confirmed {
  background: var(--strong-wash);
  border-color: var(--strong);
  color: var(--strong);
}

/* Help dialog uses the feedback-dialog shell for the modal frame; these
   are the help-specific extras for sections and glossary layout. */
.help-dialog-section {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--rule-soft);
}
.help-dialog-section:first-of-type {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}
.help-dialog-section h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: -0.005em;
}
.help-dialog-section p {
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.6;
  margin-bottom: 10px;
}
.help-dialog-section p:last-child { margin-bottom: 0; }
.help-dialog-section p strong { color: var(--ink); font-weight: 500; }

.glossary-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 4px;
}
.glossary-item {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 16px;
  align-items: start;
  padding-bottom: 10px;
  border-bottom: 1px dashed var(--rule);
}
.glossary-item:last-child { border-bottom: none; padding-bottom: 0; }
.glossary-term {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  letter-spacing: -0.005em;
  line-height: 1.35;
}
.glossary-term-acronym {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--clay);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  display: block;
  margin-top: 2px;
  font-weight: 400;
}
.glossary-def {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.6;
}

@media (max-width: 720px) {
  .glossary-item { grid-template-columns: 1fr; gap: 4px; padding-bottom: 12px; }
  .glossary-term-acronym { display: inline; margin-left: 6px; }
}

/* Print view — triggered when the body has class 'printing' */
@media print {
  body { background: white; color: black; }
  .masthead, .stage-nav, .share-row, .stage-footer, .pagefoot,
  .feedback-btn, .answers-summary-edit, .collapse-toggle,
  .incomplete-notice button, .fit-tooltip {
    display: none !important;
  }
  .stage-page { grid-template-columns: 1fr !important; padding: 0 !important; }
  .tool-card, .results-band, .answers-summary {
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .tool-card-fit { background: #f0f0f0 !important; }
  .tool-card.strong::before { background: #333 !important; }
  .results-grid { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
  .tool-card { border-color: #888 !important; padding: 12px 14px !important; }
  .tool-card-examples { background: #f7f5ef !important; border-left-color: #888 !important; }
  a { color: black !important; text-decoration: none !important; }
  a::after { content: " (" attr(href) ")"; font-size: 9px; color: #666; }
  .cards-panel a::after { content: ""; }
  @page { margin: 1.5cm; }
}

.answers-summary {
  background: var(--paper-warm);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin: 20px 0 28px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 18px 32px;
  font-size: 13px;
}
.answers-summary-item { display: flex; flex-direction: column; gap: 4px; }
.answers-summary-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.answers-summary-value {
  color: var(--ink);
  font-weight: 500;
  line-height: 1.4;
}
.answers-summary-value.empty { color: var(--ink-ghost); font-weight: 400; font-style: italic; }
.answers-summary-edit {
  margin-left: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0;
}
.answers-summary-edit:hover { color: var(--accent-deep); text-decoration: underline; }

const state = {
  stage: 1,
  answers: {
    purpose_primary: null,           // one id
    purpose_secondary: [],           // array of ids
    scope: [],                        // array of ids
    scale: null,
    capacity: null,
    approach: null,
    data: null,
    time: null,
    toc: null
  },
  showWeak: false
};

function stageComplete(n) {
  if (n === 1) return !!state.answers.purpose_primary;
  if (n === 2) return state.answers.scope.length > 0;
  if (n === 3) return !!state.answers.scale && !!state.answers.capacity;
  if (n === 4) return true; // stage 4 is results, always "complete"
  return false;
}
function stageStarted(n) {
  if (n === 1) return !!state.answers.purpose_primary || state.answers.purpose_secondary.length > 0;
  if (n === 2) return state.answers.scope.length > 0;
  if (n === 3) return !!state.answers.scale || !!state.answers.capacity || !!state.answers.approach || !!state.answers.data || !!state.answers.time;
  return false;
}

// ============================================================
// RANKING
// ============================================================
function fitScore(tool) {
  const a = state.answers;
  const breakdown = [];
  let score = 0;

  // Purpose
  if (a.purpose_primary) {
    if (tool.purpose.includes(a.purpose_primary)) {
      score += 4;
      breakdown.push({ kind: "pos", text: `matches primary purpose (+4)` });
    } else {
      breakdown.push({ kind: "neg", text: `not for primary purpose (0)` });
    }
  }
  for (const sec of a.purpose_secondary) {
    if (tool.purpose.includes(sec)) {
      score += 2;
      breakdown.push({ kind: "pos", text: `matches secondary purpose (+2)` });
    }
  }

  // Scope
  if (a.scope.length > 0) {
    const overlap = a.scope.filter(s => tool.scope.includes(s));
    if (overlap.length > 0) {
      score += 3 * overlap.length;
      breakdown.push({ kind: "pos", text: `scope overlap × ${overlap.length} (+${3 * overlap.length})` });
    } else {
      breakdown.push({ kind: "neg", text: `no scope overlap (0)` });
    }
  }

  // Scale (adjacency: international↔national, national↔subnational, subnational↔community)
  if (a.scale) {
    if (tool.scale.includes(a.scale)) {
      score += 2;
      breakdown.push({ kind: "pos", text: `scale matches (+2)` });
    } else {
      const adjacency = {
        international: ["national"],
        national: ["international", "subnational"],
        subnational: ["national", "community"],
        community: ["subnational"]
      };
      if (tool.scale.some(s => adjacency[a.scale].includes(s))) {
        score += 1;
        breakdown.push({ kind: "zero", text: `scale adjacent (+1)` });
      } else {
        breakdown.push({ kind: "neg", text: `scale mismatch (0)` });
      }
    }
  }

  // Capacity — tool fits tier or below
  if (a.capacity) {
    if (tool.capacity.includes(a.capacity)) {
      score += 2;
      breakdown.push({ kind: "pos", text: `capacity fits (+2)` });
    } else {
      const order = { low: 0, medium: 1, high: 2 };
      const toolMin = Math.min(...tool.capacity.map(c => order[c]));
      if (toolMin > order[a.capacity]) {
        breakdown.push({ kind: "neg", text: `needs capacity above your tier (0)` });
      } else {
        breakdown.push({ kind: "zero", text: `capacity borderline (0)` });
      }
    }
  }

  // Approach
  if (a.approach) {
    if (a.approach === "blended") {
      // blended is lenient — any approach tool matches somewhat
      score += 1;
      breakdown.push({ kind: "pos", text: `blended approach — any fit (+1)` });
    } else if (tool.approach.includes(a.approach)) {
      score += 1;
      breakdown.push({ kind: "pos", text: `approach matches (+1)` });
    } else {
      breakdown.push({ kind: "neg", text: `approach mismatch (0)` });
    }
  }

  // Data readiness — tool requires data you have
  if (a.data) {
    const order = { thin: 0, moderate: 1, rich: 2 };
    const userLvl = order[a.data];
    const toolMin = Math.min(...tool.data.map(d => order[d]));
    if (toolMin <= userLvl) {
      score += 1;
      breakdown.push({ kind: "pos", text: `data readiness sufficient (+1)` });
    } else {
      breakdown.push({ kind: "neg", text: `needs more data than you have (0)` });
    }
  }

  // Time horizon match
  if (a.time && tool.time.includes(a.time)) {
    score += 1;
    breakdown.push({ kind: "pos", text: `time horizon matches (+1)` });
  }

  // Theory of change — boost ToC-compatible tools if user has or wants one
  if (a.toc === "have" || a.toc === "building") {
    if (tool.toc) {
      score += 2;
      breakdown.push({ kind: "pos", text: `works with theory of change (+2)` });
    }
  }

  return { score, breakdown };
}

function rankedTools() {
  const withScores = TOOLS.map(t => {
    const { score, breakdown } = fitScore(t);
    return { ...t, _score: score, _breakdown: breakdown };
  });
  withScores.sort((a, b) => b._score - a._score || a.name.localeCompare(b.name));
  return withScores;
}

function fitBand(score, maxPossible) {
  // Absolute thresholds work better than percentage — they handle thin-answer cases
  // without inflating the "strong" band, and preserve ranking stability across
  // scenarios with different numbers of questions answered.
  // The top band is further capped by size at render time.
  if (score >= 12) return "strong";
  if (score >= 6) return "possible";
  return "weak";
}

function maxPossibleScore() {
  // maximum score any tool could earn given current answers
  const a = state.answers;
  let max = 0;
  if (a.purpose_primary) max += 4;
  max += a.purpose_secondary.length * 2;
  max += a.scope.length * 3;
  if (a.scale) max += 2;
  if (a.capacity) max += 2;
  if (a.approach) max += 1;
  if (a.data) max += 1;
  if (a.time) max += 1;
  if (a.toc === "have" || a.toc === "building") max += 2;
  return max;
}

function render() {
  renderNav();
  renderStage();
}

function renderNav() {
  const nav = document.getElementById("stage-nav");
  const stages = [
    { n: 1, title: "Purpose", sub: "Why you need M&E" },
    { n: 2, title: "Scope", sub: "What you're measuring" },
    { n: 3, title: "Scale & constraints", sub: "Where, with what" },
    { n: 4, title: "Tools for you", sub: "Your shortlist" }
  ];
  nav.innerHTML = `<div class="stage-nav-inner">${stages.map(s => {
    const isActive = state.stage === s.n;
    const isDone = stageComplete(s.n) && s.n !== 4;
    const isStarted = stageStarted(s.n);
    let stateLabel = "not started";
    if (isDone) stateLabel = "answered";
    else if (isStarted && !isDone) stateLabel = "in progress";
    else if (s.n === 4) stateLabel = stageComplete(1) && stageComplete(2) && stageComplete(3) ? "ready" : "partial";
    return `<button class="stage-chip ${isActive ? 'active' : ''} ${isDone ? 'complete' : ''}" data-stage="${s.n}">
      <span class="mono">Stage ${String(s.n).padStart(2,'0')}</span>
      <span class="serif">${s.title}</span>
      <span class="state">${stateLabel}</span>
    </button>`;
  }).join("")}</div>`;
  nav.querySelectorAll(".stage-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.stage = parseInt(chip.dataset.stage);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function renderStage() {
  const c = document.getElementById("stage-container");
  if (state.stage === 1) renderStage1(c);
  else if (state.stage === 2) renderStage2(c);
  else if (state.stage === 3) renderStage3(c);
  else if (state.stage === 4) renderStage4(c);
}

// ----- shared helpers -----
function stageBox({ stageN, stageTitle, steps, currentStep }) {
  return `<div class="stage-box">
    <div class="stage-box-header"><span>Stage</span><span>Steps</span></div>
    <div class="stage-box-stage"><strong>${stageN}. ${stageTitle}</strong></div>
    <div class="stage-box-steps"><ol>${steps.map((s, i) => `<li class="${i + 1 === currentStep ? 'current' : ''}">${s}</li>`).join("")}</ol></div>
  </div>`;
}

function navFooter({ canBack, canNext, stage }) {
  return `<div class="stage-footer">
    <button class="btn" id="btn-back" ${canBack ? '' : 'disabled'}>← Back</button>
    <div class="stage-footer-meta">Stage ${stage} of 4</div>
    <button class="btn primary" id="btn-next">${stage < 4 ? 'Continue →' : 'Refresh results'}</button>
  </div>`;
}

function attachNav() {
  const back = document.getElementById("btn-back");
  const next = document.getElementById("btn-next");
  if (back) back.addEventListener("click", () => {
    if (state.stage > 1) { state.stage--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });
  if (next) next.addEventListener("click", () => {
    if (state.stage < 4) { state.stage++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else render();
  });
}

// ----- STAGE 4 — constellation -----
function labelFor(options, id) {
  if (!id) return null;
  const found = options.find(o => o.id === id);
  return found ? found.label : id;
}
function labelsFor(options, ids) {
  return (ids || []).map(id => labelFor(options, id)).filter(Boolean);
}

  // and push the rest into "possible" so the top recommendation stays scannable.
  const STRONG_CAP = 8;
  if (bands.strong.length > STRONG_CAP) {
    const overflow = bands.strong.slice(STRONG_CAP);
    bands.strong = bands.strong.slice(0, STRONG_CAP);

    // keep possible sorted by score (overflow items have the highest scores)

          </div>

// Build a plain-text summary of the user's answers and top-ranked tools,
// suitable for pasting into an email, Word doc, or Slack.
function buildPlainSummary() {
  const a = state.answers;
  const ranked = rankedTools();
  const max = maxPossibleScore();
  const strong = ranked.filter(t => fitBand(t._score, max) === "strong").slice(0, 8);
  const possible = ranked.filter(t => fitBand(t._score, max) === "possible").slice(0, 6);

  const L = [];
  L.push("CLIMATE M&E NAVIGATOR — YOUR SHORTLIST");
  L.push("Generated " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }));
  L.push("");
  L.push("YOUR ANSWERS");
  L.push("Primary purpose:   " + (labelFor(OPT_PURPOSE, a.purpose_primary) || "not answered"));
  if (a.purpose_secondary.length) L.push("Secondary:         " + labelsFor(OPT_PURPOSE, a.purpose_secondary).join(", "));
  L.push("Scope:             " + (a.scope.length ? labelsFor(OPT_SCOPE, a.scope).join(", ") : "not answered"));
  L.push("Scale:             " + (labelFor(OPT_SCALE, a.scale) || "not answered"));
  L.push("Capacity:          " + (labelFor(OPT_CAPACITY, a.capacity) || "not answered"));
  if (a.approach) L.push("Approach:          " + labelFor(OPT_APPROACH, a.approach));
  if (a.data) L.push("Data readiness:    " + labelFor(OPT_DATA, a.data));
  if (a.time) L.push("Time horizon:      " + labelFor(OPT_TIME, a.time));
  if (a.toc) L.push("Theory of change:  " + labelFor(OPT_TOC, a.toc));
  L.push("");

  if (strong.length) {
    L.push("STRONG FIT — start here");
    L.push("");
    strong.forEach((t, i) => {
      L.push(`${i + 1}. ${t.name}`);
      L.push(`   ${t.type} · ${t.provider} · ${t.cost}`);
      L.push(`   ${t.what}`);
      if (t.examples) L.push(`   In use: ${t.examples}`);
      L.push(`   Source: ${t.link}`);
      L.push("");
    });
  }

  if (possible.length) {
    L.push("POSSIBLE FIT — useful as complements");
    L.push("");
    possible.forEach((t, i) => {
      L.push(`${i + 1}. ${t.name}  (${t.provider})`);
      L.push(`   ${t.what}`);
      L.push(`   Source: ${t.link}`);
      L.push("");
    });
  }

  L.push("---");
  L.push("Generated by the Climate M&E Navigator, a working-draft diagnostic tool.");
  L.push("Rankings reflect the answers above. Your context matters more than the ranking —");
  L.push("treat this as a starting shortlist, not a prescription.");
  return L.join("\n");
}

function renderBand(heading, cls, tools, desc) {
  if (tools.length === 0) {
    return `<div class="results-band">
      <div class="results-band-header">
        <h2 class="results-band-heading serif">${heading}</h2>
        <span class="results-band-count mono">0 tools</span>
        <span class="results-band-desc">${desc}</span>
      </div>
      <div style="padding:20px; color:var(--ink-muted); font-style:italic; font-size:13px; border:1px dashed var(--rule); border-radius:var(--radius);">
        No tools in this band given your answers. ${cls === "strong" ? "Consider broadening scope or capacity tier." : ""}
      </div>
    </div>`;
  }
  return `<div class="results-band">
    <div class="results-band-header">
      <h2 class="results-band-heading serif">${heading}</h2>
      <span class="results-band-count mono">${tools.length} tool${tools.length === 1 ? '' : 's'}</span>
      <span class="results-band-desc">${desc}</span>
    </div>
    <div class="results-grid">
      ${tools.map(t => toolCardHTML(t, cls)).join("")}
    </div>
  </div>`;
}

function toolCardHTML(t, cls) {
  const breakdown = t._breakdown.map(b => `<li class="${b.kind}">${b.text}</li>`).join("");
  // generate a "why" line from the strongest positive reasons
  const positives = t._breakdown.filter(b => b.kind === "pos");
  let why = "";
  if (positives.length > 0) {
    why = `<div class="tool-card-why"><strong>Why this fits:</strong> ${positives.slice(0, 3).map(p => p.text.replace(/\s*\(\+\d+\)/, '')).join("; ")}.</div>`;
  } else if (cls === "weak") {
    const negatives = t._breakdown.filter(b => b.kind === "neg");
    if (negatives.length) {
      why = `<div class="tool-card-why"><strong>Why it ranks weak:</strong> ${negatives.slice(0, 2).map(p => p.text.replace(/\s*\(0\)/, '')).join("; ")}.</div>`;
    }
  }
  return `<article class="tool-card ${cls}">
    <div class="tool-card-fit" tabindex="0">
      fit ${t._score}
      <div class="fit-tooltip"><ul>${breakdown || '<li class="zero">Answer the questions to see how this ranks.</li>'}</ul></div>
    </div>
    <div class="tool-card-name serif">${t.name}</div>
    <div class="tool-card-meta mono">${t.type}<span class="sep">·</span>${t.provider}</div>
    ${t.toc ? `<div class="tool-card-toc-badge">Works with theory of change</div>` : ''}
    <div class="tool-card-what">${t.what}</div>
    ${t.examples ? `<div class="tool-card-examples"><span class="tool-card-examples-label">In use:</span> ${t.examples}</div>` : ''}
    ${why}
    <div class="tool-card-footer">
      <span class="tool-card-cost">${t.cost}</span>
      <a class="tool-card-link" href="${t.link}" target="_blank" rel="noopener">Source →</a>
    </div>
  </article>`;
}

// Glossary entries — kept short, written for someone new to climate M&E.
const GLOSSARY = [
  {
    term: "Biennial Transparency Report",
    acronym: "BTR",
    def: "The main reporting document countries submit to the UNFCCC under the Paris Agreement, every two years. Covers GHG emissions, progress on NDC targets, climate impacts and adaptation, and finance received or provided. First BTRs were due by end of 2024."
  },
  {
    term: "Nationally Determined Contribution",
    acronym: "NDC",
    def: "A country's pledge under the Paris Agreement covering what it will do to reduce emissions and (often) how it will adapt. Updated every five years, with each update expected to be more ambitious than the last."
  },
  {
    term: "National Adaptation Plan",
    acronym: "NAP",
    def: "A country's medium-to-long-term strategy for adapting to climate change — identifying vulnerabilities, prioritising actions, and laying out implementation arrangements. Many developing countries are now turning their NAPs into actual delivery plans, which is what M&E systems track."
  },
  {
    term: "National Biodiversity Strategy and Action Plan",
    acronym: "NBSAP",
    def: "The country-level instrument for delivering on the UN Convention on Biological Diversity. Currently being updated to align with the Kunming-Montreal Global Biodiversity Framework adopted in 2022."
  },
  {
    term: "Measurement, Reporting and Verification",
    acronym: "MRV",
    def: "The standard process for tracking GHG emissions and reductions in a way that is credible to the UNFCCC and to funders. Measurement is collecting the data, reporting is putting it into the right format, and verification is independent checking that the numbers hold up."
  },
  {
    term: "Enhanced Transparency Framework",
    acronym: "ETF",
    def: "The Paris Agreement's reporting regime — the system that BTRs feed into. Replaced the older two-track system that gave developing countries lighter requirements; now everyone reports against the same template, with flexibility on detail for those that need it."
  },
  {
    term: "GHG inventory",
    acronym: "",
    def: "A systematic accounting of a country's (or city's, or company's) greenhouse gas emissions, broken down by sector and gas. The starting point for almost any mitigation work. Built using IPCC methodologies."
  },
  {
    term: "Sendai Framework",
    acronym: "",
    def: "The global agreement on disaster risk reduction (2015–2030). Has seven global targets countries report against — covering disaster mortality, affected populations, economic losses, damage to infrastructure, and the existence of national DRR strategies."
  },
  {
    term: "Voluntary National Review",
    acronym: "VNR",
    def: "A country's self-assessment of progress on the Sustainable Development Goals, presented at the UN's High-Level Political Forum. Both narrative and indicator-based; some countries integrate climate and biodiversity SDG reporting here."
  },
  {
    term: "Global Biodiversity Framework",
    acronym: "GBF",
    def: "The Kunming-Montreal Global Biodiversity Framework, adopted at CBD COP15 in 2022. Has 23 targets for 2030, including the well-known 30-by-30 target on protected areas. Comes with a monitoring framework of headline indicators."
  },
  {
    term: "Theory of change",
    acronym: "ToC",
    def: "A clear statement of how and why your activities are expected to lead to the outcomes you want — including the assumptions and intermediate steps along the way. Useful for M&E because it tells you what to measure and where to look for problems if things are not working."
  },
  {
    term: "Transformational change",
    acronym: "",
    def: "Systemic shifts in how a sector or society works — going beyond incremental improvement. Examples: shifting energy systems to renewables, reorganising land use, changing institutions and norms. Hard to measure with traditional logframes, which is why methods like Outcome Harvesting and Contribution Analysis appear in the toolkit."
  },
  {
    term: "Locally-led adaptation",
    acronym: "LLA",
    def: "An approach where decisions about adaptation are made by people most affected, with resources flowing to local institutions. Defined by eight principles agreed in 2021. Implies M&E approaches that capture local definitions of success, not just donor-set indicators."
  },
  {
    term: "National Implementing Entity",
    acronym: "NIE",
    def: "An in-country organisation accredited to receive climate finance directly (mainly under the Adaptation Fund and GCF), without going through a multilateral intermediary. Direct access matters for country ownership but comes with full reporting obligations — which is where many of the project-level M&E tools come in."
  },
  {
    term: "AFOLU",
    acronym: "",
    def: "Agriculture, Forestry and Other Land Use — the IPCC's combined category for emissions and removals from land-based activities. Often the trickiest part of a national inventory, especially for forest-rich countries where REDD+ work overlaps."
  },
  {
    term: "Results framework",
    acronym: "",
    def: "A structured table laying out what a project or programme aims to achieve — typically with goals, outcomes, outputs, indicators, baselines, and targets. Most major climate funds (GCF, GEF, AF) have mandatory results frameworks projects must use."
  },
  {
    term: "Indicator",
    acronym: "",
    def: "A specific, measurable thing that tells you whether something is happening — like hectares of forest under improved management, or number of households with climate-resilient water supply. Good indicators are specific, relevant, and feasible to measure regularly."
  },
  {
    term: "Baseline",
    acronym: "",
    def: "The starting state against which change will be measured. Without a credible baseline, you cannot claim a project caused improvement — you do not know what was happening before. Establishing baselines is often half the work of designing M&E."
  },
  {
    term: "MEL",
    acronym: "",
    def: "Monitoring, Evaluation and Learning. The L matters: it is what distinguishes M&E that just produces reports from M&E that actually changes how a programme is run. Most modern frameworks emphasise MEL rather than M&E alone."
  },
  {
    term: "Loss and damage",
    acronym: "L&D",
    def: "The harms from climate change that go beyond what adaptation can prevent — including economic losses (damaged infrastructure, lost crops) and non-economic ones (cultural loss, displacement, ecosystem damage). A formal track under the UNFCCC since 2013, with the Loss and Damage Fund agreed at COP28."
  }
];

function openHelpDialog() {
  const existing = document.getElementById("help-dialog");
  if (existing) existing.remove();

  const dialog = document.createElement("div");
  dialog.id = "help-dialog";
  dialog.className = "feedback-dialog-backdrop";

  const glossaryHTML = GLOSSARY
    .slice()
    .sort((a, b) => a.term.localeCompare(b.term))
    .map(g => `
      <div class="glossary-item">
        <div class="glossary-term">
          ${g.term}
          ${g.acronym ? `<span class="glossary-term-acronym">${g.acronym}</span>` : ''}
        </div>
        <div class="glossary-def">${g.def}</div>
      </div>
    `).join("");

  dialog.innerHTML = `
    <div class="feedback-dialog-panel wide">
      <button class="feedback-dialog-close" id="help-close" aria-label="Close">×</button>
      <h3 class="feedback-dialog-title serif">Help &amp; glossary</h3>

      <div class="help-dialog-section">
        <h4>How to use this</h4>
        <p>Four short stages, about two minutes. <strong>Stage 1</strong> asks why you need M&amp;E. <strong>Stage 2</strong> asks what you are measuring. <strong>Stage 3</strong> asks where you work and what resources you have. <strong>Stage 4</strong> shows you a ranked shortlist of tools that fit your answers.</p>
        <p>You can <strong>jump between stages</strong> at any time using the bar at the top — your answers are kept. Required questions are marked, optional ones are clearly labelled. The more you answer, the sharper the shortlist gets.</p>
        <p>If a term is unfamiliar, check the glossary below. If you do not know how to answer something, skip it — most questions are optional and the tool works fine with partial answers.</p>
        <p>At Stage 4 you can <strong>copy the shortlist</strong>, <strong>save it as PDF</strong>, or <strong>save the whole tool with your answers for offline use</strong> — useful for sharing a scenario with a colleague or for working without internet.</p>
      </div>

      <div class="help-dialog-section">
        <h4>What the rankings mean</h4>
        <p><strong>Strong fit</strong> are tools whose tagged purpose, scope, scale, and capacity overlap most with your answers. Start here — but do not treat them as a recommendation. Your context (country, donor, team, history) matters more than the ranking.</p>
        <p><strong>Possible fit</strong> tools partly overlap. Often useful as complements to a strong-fit choice — for example, a participatory method paired with an indicator framework.</p>
        <p><strong>Weaker fit</strong> tools usually serve a different purpose or scale. Shown so you can see the full inventory; mostly safe to skip.</p>
        <p>Hover the small grey "fit" box on any tool card to see exactly which of your answers pushed its score up or down. This is deliberately transparent — the logic can be debated and improved.</p>
      </div>

      <div class="help-dialog-section">
        <h4>Glossary of climate M&amp;E terms</h4>
        <p style="margin-bottom: 14px;">Brief plain-language definitions. Not exhaustive — just the terms you are most likely to bump into in tool descriptions and option labels.</p>
        <div class="glossary-list">
          ${glossaryHTML}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(dialog);

  const close = () => dialog.remove();
  document.getElementById("help-close").addEventListener("click", close);
  dialog.addEventListener("click", (e) => { if (e.target === dialog) close(); });
  document.addEventListener("keydown", function escHandler(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", escHandler); }
  });
}

function wireHelpButton() {
  const btn = document.getElementById("help-btn");
  if (!btn) return;
  btn.addEventListener("click", openHelpDialog);
}

// FEEDBACK
// ============================================================
function buildFeedbackMailto() {
  const a = state.answers;
  const lines = [];
  lines.push("Thanks for sending feedback on the Climate M&E Navigator.");
  lines.push("");
  lines.push("--- Your current context (auto-filled; edit or delete if not relevant) ---");
  lines.push(`Stage you are on: ${state.stage} of 4`);
  lines.push(`Primary purpose: ${labelFor(OPT_PURPOSE, a.purpose_primary) || "not answered"}`);
  if (a.purpose_secondary.length) {
    lines.push(`Secondary purposes: ${labelsFor(OPT_PURPOSE, a.purpose_secondary).join(", ")}`);
  }
  lines.push(`Scope: ${a.scope.length ? labelsFor(OPT_SCOPE, a.scope).join(", ") : "not answered"}`);
  lines.push(`Scale: ${labelFor(OPT_SCALE, a.scale) || "not answered"}`);
  lines.push(`Capacity: ${labelFor(OPT_CAPACITY, a.capacity) || "not answered"}`);
  if (a.approach) lines.push(`Approach: ${labelFor(OPT_APPROACH, a.approach)}`);
  if (a.data) lines.push(`Data readiness: ${labelFor(OPT_DATA, a.data)}`);
  if (a.time) lines.push(`Time horizon: ${labelFor(OPT_TIME, a.time)}`);
  if (a.toc) lines.push(`Theory of change: ${labelFor(OPT_TOC, a.toc)}`);
  lines.push("");
  lines.push("--- Your feedback (please write below) ---");
  lines.push("");
  lines.push("What worked well:");
  lines.push("");
  lines.push("What did not work / felt wrong:");
  lines.push("");
  lines.push("Tools or methods that should be added or removed:");
  lines.push("");
  lines.push("Anything else:");
  lines.push("");

  const subject = "Feedback on Climate M&E Navigator (v0.4)";
  const body = lines.join("\n");
  return `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function wireFeedbackButton() {
  const btn = document.getElementById("feedback-btn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    if (FEEDBACK_EMAIL === "YOUR-EMAIL@example.com") {
      alert("Feedback email is not yet configured.\n\nThe person who shared this tool needs to set the FEEDBACK_EMAIL constant at the top of the <script> block in the HTML file before sharing.");
      return;
    }
    openFeedbackDialog();
  });
}

function openFeedbackDialog() {
  // Remove any existing dialog (defensive)
  const existing = document.getElementById("feedback-dialog");
  if (existing) existing.remove();

  const a = state.answers;
  const lines = [];
  lines.push("Thanks for sending feedback on the Climate M&E Navigator.");
  lines.push("");
  lines.push("--- Your current context (auto-filled; edit or delete if not relevant) ---");
  lines.push(`Stage you are on: ${state.stage} of 4`);
  lines.push(`Primary purpose: ${labelFor(OPT_PURPOSE, a.purpose_primary) || "not answered"}`);
  if (a.purpose_secondary.length) lines.push(`Secondary purposes: ${labelsFor(OPT_PURPOSE, a.purpose_secondary).join(", ")}`);
  lines.push(`Scope: ${a.scope.length ? labelsFor(OPT_SCOPE, a.scope).join(", ") : "not answered"}`);
  lines.push(`Scale: ${labelFor(OPT_SCALE, a.scale) || "not answered"}`);
  lines.push(`Capacity: ${labelFor(OPT_CAPACITY, a.capacity) || "not answered"}`);
  if (a.approach) lines.push(`Approach: ${labelFor(OPT_APPROACH, a.approach)}`);
  if (a.data) lines.push(`Data readiness: ${labelFor(OPT_DATA, a.data)}`);
  if (a.time) lines.push(`Time horizon: ${labelFor(OPT_TIME, a.time)}`);
  if (a.toc) lines.push(`Theory of change: ${labelFor(OPT_TOC, a.toc)}`);
  lines.push("");
  lines.push("--- Your feedback (please write below) ---");
  lines.push("");
  lines.push("What worked well:");
  lines.push("");
  lines.push("What did not work / felt wrong:");
  lines.push("");
  lines.push("Tools or methods that should be added or removed:");
  lines.push("");
  lines.push("Anything else:");
  lines.push("");

  const subject = "Feedback on Climate M&E Navigator (v0.4)";
  const body = lines.join("\n");
  const mailtoUrl = `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(FEEDBACK_EMAIL)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const outlookUrl = `https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(FEEDBACK_EMAIL)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  const dialog = document.createElement("div");
  dialog.id = "feedback-dialog";
  dialog.className = "feedback-dialog-backdrop";
  dialog.innerHTML = `
    <div class="feedback-dialog-panel">
      <button class="feedback-dialog-close" id="fb-close" aria-label="Close">×</button>
      <h3 class="feedback-dialog-title serif">Send feedback</h3>
      <p class="feedback-dialog-intro">Pick whichever way works for you. Your current answers will be included as context.</p>

      <div class="feedback-dialog-actions">
        <a class="feedback-dialog-btn primary" href="${gmailUrl}" target="_blank" rel="noopener" id="fb-gmail">
          <span>Open in Gmail</span>
          <span class="feedback-dialog-btn-sub">opens in new tab</span>
        </a>
        <a class="feedback-dialog-btn" href="${outlookUrl}" target="_blank" rel="noopener" id="fb-outlook">
          <span>Open in Outlook web</span>
          <span class="feedback-dialog-btn-sub">opens in new tab</span>
        </a>
        <a class="feedback-dialog-btn" href="${mailtoUrl}" id="fb-mail">
          <span>Open default mail app</span>
          <span class="feedback-dialog-btn-sub">Outlook, Mail, Thunderbird etc</span>
        </a>
      </div>

      <div class="feedback-dialog-section">
        <p class="feedback-dialog-or">Or copy the message manually:</p>
        <div class="feedback-dialog-field">
          <label>Send to</label>
          <div class="feedback-dialog-copy-row">
            <input type="text" readonly value="${FEEDBACK_EMAIL}" id="fb-to-field" />
            <button class="feedback-dialog-copy-btn" data-copy="fb-to-field">Copy</button>
          </div>
        </div>
        <div class="feedback-dialog-field">
          <label>Subject</label>
          <div class="feedback-dialog-copy-row">
            <input type="text" readonly value="${subject}" id="fb-subj-field" />
            <button class="feedback-dialog-copy-btn" data-copy="fb-subj-field">Copy</button>
          </div>
        </div>
        <div class="feedback-dialog-field">
          <label>Message</label>
          <textarea readonly rows="8" id="fb-body-field">${body}</textarea>
          <button class="feedback-dialog-copy-btn full" data-copy="fb-body-field">Copy message</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(dialog);

  const close = () => dialog.remove();
  document.getElementById("fb-close").addEventListener("click", close);
  dialog.addEventListener("click", (e) => { if (e.target === dialog) close(); });
  document.addEventListener("keydown", function escHandler(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", escHandler); }
  });

  // Wire copy buttons
  dialog.querySelectorAll(".feedback-dialog-copy-btn").forEach(b => {
    b.addEventListener("click", async () => {
      const targetId = b.dataset.copy;
      const field = document.getElementById(targetId);
      const text = field.value;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        field.select();
        try { document.execCommand("copy"); } catch (e) {}
      }
      const original = b.textContent;
      b.textContent = "Copied ✓";
      b.classList.add("confirmed");
      setTimeout(() => { b.textContent = original; b.classList.remove("confirmed"); }, 1800);
    });
  });
}

// INIT
// If this file was saved with answers (via "Save for offline use"), restore them.
const savedState = document.body.getAttribute("data-saved-state");
if (savedState) {
  try {
    const parsed = JSON.parse(savedState);
    if (parsed && parsed.answers) {
      Object.assign(state, parsed);
      document.body.removeAttribute("data-saved-state");
    }
  } catch (e) {
    // Malformed state — just start fresh.
  }
}
render();
wireFeedbackButton();
wireHelpButton();
</script>
