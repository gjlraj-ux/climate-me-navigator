<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate M&E Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a17;
  --ink-soft: #3d3d38;
  --ink-muted: #6b6b63;
  --ink-ghost: #9d9d93;
  --paper: #fbf9f4;
  --paper-warm: #f4f0e6;
  --paper-shade: #efeadb;
  --rule: #d9d4c5;
  --rule-soft: #e8e3d4;
  --accent: #c7570f;
  --accent-deep: #8a3b09;
  --accent-wash: #f7e6d4;
  --strong: #3d6b3f;
  --strong-wash: #dfe8df;
  --weak: #8f7a4a;
  --weak-wash: #ede5cf;
  --ground: #4a5d6e;          /* slate-blue for Stage 0, distinct from accent */
  --ground-wash: #e2e7ec;
  --ground-deep: #2f3d49;
  --radius: 4px;
  --max-w: 1220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.serif { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

/* ========== MASTHEAD ========== */
.masthead {
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.masthead-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 24px 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 32px;
}
.masthead-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.masthead-buttons {
  display: flex;
  gap: 8px;
}
.feedback-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 7px 14px;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s;
}
.feedback-btn:hover {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.feedback-btn-icon { font-size: 13px; line-height: 1; }
.wordmark-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.wordmark-title em { font-style: italic; font-weight: 400; color: var(--accent); }
.wordmark-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 4px;
}

/* ========== STAGE NAV ========== */
.stage-nav {
  background: var(--paper-warm);
  border-bottom: 1px solid var(--rule);
  position: sticky;
  top: 0;
  z-index: 10;
}
.stage-nav-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 14px 40px;
  display: flex;
  gap: 0;
  align-items: stretch;
}
.stage-chip {
  flex: 1;
  background: none;
  border: none;
  text-align: left;
  cursor: pointer;
  padding: 10px 14px;
  font-family: inherit;
  color: var(--ink-muted);
  border-left: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: all 0.15s;
}
.stage-chip:first-child { border-left: none; }
.stage-chip:hover { background: var(--paper); color: var(--ink); }
.stage-chip.active {
  color: var(--ink);
  background: var(--paper);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.stage-chip.active[data-stage="0"] {
  box-shadow: inset 0 -2px 0 var(--ground);
}
.stage-chip .mono {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.stage-chip .serif {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.005em;
}
.stage-chip .state {
  font-size: 11px;
  color: var(--ink-ghost);
  font-style: italic;
}
.stage-chip.active .state { color: var(--accent); font-style: normal; }
.stage-chip.active[data-stage="0"] .state { color: var(--ground); }
.stage-chip.complete .state { color: var(--strong); font-style: normal; }
.stage-chip.complete .state::before { content: "● "; }

/* ========== STAGE PAGE ========== */
.stage-page {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 40px 40px 32px;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 56px;
}
.stage-page[data-stage="4"] { grid-template-columns: 1fr; }

.stage-intro {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.stage-kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.stage-heading {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.015em;
  color: var(--accent);
}
.stage-heading em { color: var(--ink); font-style: italic; font-weight: 400; }
/* Stage 0 uses ground color instead of accent */
.stage-page[data-stage="0"] .stage-heading { color: var(--ground); }
.stage-page[data-stage="0"] .stage-kicker { color: var(--ground); }

.stage-intro-body {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-soft);
  max-width: 38ch;
}
.stage-intro-body p { margin-bottom: 12px; }

.stage-box {
  border: 1px dashed var(--ink-ghost);
  padding: 0;
  max-width: 330px;
  margin-top: 8px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  font-size: 12.5px;
  background: var(--paper);
}
.stage-box-header {
  grid-column: 1 / -1;
  background: var(--rule-soft);
  padding: 6px 10px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 1px dashed var(--ink-ghost);
}
.stage-box-header span { padding: 2px 0; }
.stage-box-stage, .stage-box-steps {
  padding: 10px 10px;
  color: var(--ink-soft);
  line-height: 1.55;
}
.stage-box-stage { border-right: 1px dashed var(--ink-ghost); }
.stage-box-steps ol { padding-left: 14px; }
.stage-box-steps li { margin-bottom: 3px; }
.stage-box-steps li.current { color: var(--accent); font-weight: 500; }
.stage-page[data-stage="0"] .stage-box-steps li.current { color: var(--ground); }

.stage-body {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.step-block { border-top: 2px solid var(--accent); padding-top: 22px; }
.stage-page[data-stage="0"] .step-block { border-top-color: var(--ground); }

.step-heading {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--accent);
  margin-bottom: 16px;
}
.stage-page[data-stage="0"] .step-heading { color: var(--ground); }

.step-prompt {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink-soft);
  margin-bottom: 18px;
  max-width: 58ch;
}
.step-prompt em { color: var(--ink); font-style: italic; }

/* ========== STAGE 0 — GROUNDING CARDS ========== */
.grounding-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.grounding-card {
  border: 1px dashed var(--ground);
  background: var(--paper);
  border-radius: var(--radius);
  padding: 20px 22px;
  position: relative;
}
.grounding-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 4px;
}
.grounding-card-name {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 18px;
  line-height: 1.25;
  letter-spacing: -0.005em;
  color: var(--ink);
}
.grounding-card-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ground);
  margin-bottom: 12px;
}
.grounding-card-meta .sep { color: var(--ink-ghost); margin: 0 6px; }
.grounding-card-section {
  margin-top: 10px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink-soft);
}
.grounding-card-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ground);
  font-weight: 500;
  display: block;
  margin-bottom: 4px;
}
.grounding-card-label.caution { color: var(--accent-deep); }
.grounding-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--rule);
}
.grounding-card-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ground);
  text-decoration: none;
  border-bottom: 1px solid var(--ground-wash);
  padding-bottom: 1px;
}
.grounding-card-link:hover { color: var(--ground-deep); border-color: var(--ground-deep); }
.grounding-mark {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: none;
  border: 1px solid var(--rule);
  padding: 5px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
}
.grounding-mark:hover { border-color: var(--ground); color: var(--ground); }
.grounding-mark.marked {
  background: var(--ground-wash);
  border-color: var(--ground);
  color: var(--ground-deep);
}
.grounding-mark.marked::before { content: "✓ "; }

.grounding-skip-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 20px;
}
.grounding-skip-btn {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 9px 18px;
  background: var(--paper);
  color: var(--ground-deep);
  border: 1px solid var(--ground);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
}
.grounding-skip-btn:hover {
  background: var(--ground);
  color: var(--paper);
}

/* ========== OPTIONS ========== */
.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  max-width: 640px;
}
.options.grid-2 { grid-template-columns: 1fr 1fr; gap: 10px; }
.option {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  background: var(--paper);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
  color: inherit;
  font-size: 14px;
  line-height: 1.5;
  width: 100%;
}
.option:hover { border-color: var(--ink-muted); background: var(--paper-warm); }
.option.selected { border-color: var(--accent); background: var(--accent-wash); }
.option-marker {
  flex-shrink: 0;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--rule);
  background: var(--paper);
  margin-top: 2px;
  position: relative;
}
.option.selected .option-marker {
  border-color: var(--accent);
  background: var(--accent);
}
.option.selected .option-marker::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: var(--paper);
  border-radius: 50%;
}
.option[data-kind="check"] .option-marker { border-radius: 3px; }
.option[data-kind="check"].selected .option-marker::after { border-radius: 0; inset: 2px; }
.option-body { flex: 1; }
.option-label {
  font-weight: 500;
  color: var(--ink);
  font-size: 14px;
  letter-spacing: -0.005em;
}
.option-help {
  font-size: 12.5px;
  color: var(--ink-muted);
  line-height: 1.5;
  margin-top: 3px;
}

/* ========== STAGE 3 — collapsible optionals ========== */
.optional-toggle-row {
  border-top: 1px dashed var(--rule);
  padding-top: 18px;
  margin-top: 8px;
}
.optional-toggle {
  background: none;
  border: 1px solid var(--rule);
  padding: 10px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  cursor: pointer;
  border-radius: var(--radius);
  width: 100%;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.15s;
}
.optional-toggle:hover { color: var(--ink); border-color: var(--ink-muted); }
.optional-toggle .chev { transition: transform 0.2s; }
.optional-toggle.open .chev { transform: rotate(90deg); }

/* ========== NAVIGATION FOOTER ========== */
.stage-footer {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 20px 40px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  border-top: 1px solid var(--rule-soft);
  margin-top: 32px;
}
.stage-footer-nav { display: flex; gap: 8px; }
.btn {
  font-family: inherit;
  font-size: 13.5px;
  letter-spacing: -0.005em;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--ink-muted); color: var(--ink); background: var(--paper-warm); }
.btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.stage-footer-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* ========== STAGE 4 ========== */
.constellation-header {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 4px 0 24px;
}
.constellation-header .stage-heading { max-width: none; }

.share-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--rule-soft);
}
.share-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 8px 14px;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.share-btn:hover {
  background: var(--paper-warm);
  border-color: var(--ink-muted);
  color: var(--ink);
}
.share-btn-icon { font-size: 14px; line-height: 1; }
.share-btn.confirmed {
  background: var(--strong-wash);
  border-color: var(--strong);
  color: var(--strong);
}

/* ===== DIALOGS ===== */
.feedback-dialog-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(26, 26, 23, 0.55);
  z-index: 100;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 60px 20px 20px;
  overflow-y: auto;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.feedback-dialog-panel {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  max-width: 540px;
  width: 100%;
  padding: 28px 32px 26px;
  position: relative;
  box-shadow: 0 12px 40px rgba(26, 26, 23, 0.18);
  max-height: 88vh;
  overflow-y: auto;
}
.feedback-dialog-panel.wide { max-width: 760px; }
.feedback-dialog-close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: none;
  border: none;
  font-size: 24px;
  line-height: 1;
  color: var(--ink-muted);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--radius);
}
.feedback-dialog-close:hover { background: var(--paper-warm); color: var(--ink); }
.feedback-dialog-title {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin-bottom: 6px;
}
.feedback-dialog-intro {
  font-size: 13.5px;
  color: var(--ink-muted);
  line-height: 1.55;
  margin-bottom: 20px;
}
.feedback-dialog-actions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
.feedback-dialog-btn {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  text-decoration: none;
  padding: 11px 16px;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  transition: all 0.15s;
}
.feedback-dialog-btn:hover { background: var(--paper-warm); border-color: var(--ink-muted); }
.feedback-dialog-btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.feedback-dialog-btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.feedback-dialog-btn-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  font-weight: 400;
}
.feedback-dialog-section { border-top: 1px solid var(--rule-soft); padding-top: 18px; }
.feedback-dialog-or { font-size: 12.5px; color: var(--ink-muted); font-style: italic; margin-bottom: 12px; }
.feedback-dialog-field { margin-bottom: 14px; }
.feedback-dialog-field label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 5px;
}
.feedback-dialog-copy-row { display: flex; gap: 6px; }
.feedback-dialog-copy-row input {
  flex: 1;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  background: var(--paper-warm);
  color: var(--ink);
}
.feedback-dialog-field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  background: var(--paper-warm);
  color: var(--ink-soft);
  resize: vertical;
  line-height: 1.5;
  margin-bottom: 6px;
}
.feedback-dialog-copy-btn {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 14px;
  background: var(--paper);
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.feedback-dialog-copy-btn.full { width: 100%; }
.feedback-dialog-copy-btn:hover { background: var(--paper-warm); border-color: var(--ink-muted); color: var(--ink); }
.feedback-dialog-copy-btn.confirmed { background: var(--strong-wash); border-color: var(--strong); color: var(--strong); }

.help-dialog-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--rule-soft); }
.help-dialog-section:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
.help-dialog-section h4 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: -0.005em;
}
.help-dialog-section p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 10px; }
.help-dialog-section p:last-child { margin-bottom: 0; }
.help-dialog-section p strong { color: var(--ink); font-weight: 500; }

.glossary-list { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 4px; }
.glossary-item {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 16px;
  align-items: start;
  padding-bottom: 10px;

const state = {
  stage: 0,
  answers: {
    purpose_primary: null,
    purpose_secondary: [],
    scope: [],
    scale: null,
    capacity: null,
    approach: null,
    data: null,
    time: null,
    toc: null
  },
  groundingMarked: {},        // { docId: true } for cosmetic "I have this" toggles
  showWeak: false,
  showOptional: false         // Stage 3 optional questions collapsed by default
};

function stageComplete(n) {
  if (n === 0) return true;
  if (n === 1) return !!state.answers.purpose_primary;
  if (n === 2) return state.answers.scope.length > 0;
  if (n === 3) return !!state.answers.scale && !!state.answers.capacity;
  if (n === 4) return true;
  return false;
}
function stageStarted(n) {
  if (n === 0) return Object.keys(state.groundingMarked).length > 0;
  if (n === 1) return !!state.answers.purpose_primary || state.answers.purpose_secondary.length > 0;
  if (n === 2) return state.answers.scope.length > 0;
  if (n === 3) return !!state.answers.scale || !!state.answers.capacity || !!state.answers.approach || !!state.answers.data || !!state.answers.time;
  return false;
}

// ============================================================
// RANKING (with fixes from review)
// ============================================================
function fitScore(tool) {
  const a = state.answers;
  const breakdown = [];
  let score = 0;

  // ---- Purpose ----
  if (a.purpose_primary) {
    if (tool.purpose.includes(a.purpose_primary)) {
      score += 4;
      breakdown.push({ kind: "pos", text: `matches primary purpose (+4)` });
    } else {
      breakdown.push({ kind: "neg", text: `not for primary purpose (0)` });
    }
  }
  for (const sec of a.purpose_secondary) {
    if (tool.purpose.includes(sec)) {
      score += 2;
      breakdown.push({ kind: "pos", text: `matches secondary purpose (+2)` });
    }
  }

  // ---- Scope ----
  if (a.scope.length > 0) {
    const overlap = a.scope.filter(s => tool.scope.includes(s));
    if (overlap.length > 0) {
      score += 3 * overlap.length;
      breakdown.push({ kind: "pos", text: `scope overlap × ${overlap.length} (+${3 * overlap.length})` });
    } else {
      breakdown.push({ kind: "neg", text: `no scope overlap (0)` });
    }
  }

  // ---- Scale (adjacency awarded for adjacent levels) ----
  if (a.scale) {
    if (tool.scale.includes(a.scale)) {
      score += 2;
      breakdown.push({ kind: "pos", text: `scale matches (+2)` });
    } else {
      const adjacency = {
        international: ["national"],
        national: ["international", "subnational"],
        subnational: ["national", "community"],
        community: ["subnational"]
      };
      if (tool.scale.some(s => adjacency[a.scale].includes(s))) {
        score += 1;
        breakdown.push({ kind: "zero", text: `scale adjacent (+1)` });
      } else {
        breakdown.push({ kind: "neg", text: `scale mismatch (0)` });
      }
    }
  }

  // ---- Capacity — FIXED: tool's minimum capacity must be <= user's tier ----
  // (Previously, a high-capacity user got 0 for a low-capacity tool, which was wrong:
  //  a strong team can absolutely run a simple tool. The right check is whether the
  //  tool requires MORE capacity than the user has.)
  if (a.capacity) {
    const order = { low: 0, medium: 1, high: 2 };
    const userLvl = order[a.capacity];
    const toolMin = Math.min(...tool.capacity.map(c => order[c]));
    if (tool.capacity.includes(a.capacity)) {
      score += 2;
      breakdown.push({ kind: "pos", text: `capacity fits (+2)` });
    } else if (toolMin < userLvl) {
      // tool is below user's tier — usable, just maybe under-using capacity
      score += 1;
      breakdown.push({ kind: "zero", text: `tool is simpler than your capacity (+1)` });
    } else {
      // tool requires capacity above what user has
      breakdown.push({ kind: "neg", text: `needs more capacity than you have (0)` });
    }
  }

  // ---- Approach — FIXED: blended user no longer gets free +1 for every tool ----
  // (Previously every tool got +1 if the user said "blended", which flattened the
  //  dimension. Now blended only rewards tools that are tagged blended OR that
  //  combine top-down and bottom-up.)
  if (a.approach) {
    if (a.approach === "blended") {
      if (tool.approach.includes("blended") || tool.approach.length > 1) {
        score += 1;
        breakdown.push({ kind: "pos", text: `combines methods (+1)` });
      }
    } else if (tool.approach.includes(a.approach)) {
      score += 1;
      breakdown.push({ kind: "pos", text: `approach matches (+1)` });
    } else {
      breakdown.push({ kind: "neg", text: `approach mismatch (0)` });
    }
  }

  // ---- Data readiness ----
  if (a.data) {
    const order = { thin: 0, moderate: 1, rich: 2 };
    const userLvl = order[a.data];
    const toolMin = Math.min(...tool.data.map(d => order[d]));
    if (toolMin <= userLvl) {
      score += 1;
      breakdown.push({ kind: "pos", text: `data readiness sufficient (+1)` });
    } else {
      breakdown.push({ kind: "neg", text: `needs more data than you have (0)` });
    }
  }

  // ---- Time horizon — FIXED: penalise far mismatches, not just reward matches ----
  // (Previously time horizon was reward-only. Now a tool needing years scores
  //  worse when the user has weeks, and vice-versa, because horizon mismatches
  //  are a real practical issue.)
  if (a.time) {
    const order = { weeks: 0, months: 1, years: 2 };
    const userLvl = order[a.time];
    const toolLvls = tool.time.map(t => order[t]);
    if (tool.time.includes(a.time)) {
      score += 1;
      breakdown.push({ kind: "pos", text: `time horizon matches (+1)` });
    } else {
      const minDist = Math.min(...toolLvls.map(l => Math.abs(l - userLvl)));
      if (minDist >= 2) {
        // far mismatch (weeks vs years) — meaningful negative signal
        score -= 1;
        breakdown.push({ kind: "neg", text: `time horizon far off (−1)` });
      } else {
        breakdown.push({ kind: "zero", text: `time horizon adjacent (0)` });
      }
    }
  }

  // ---- Theory of change ----
  if (a.toc === "have" || a.toc === "building") {
    if (tool.toc) {
      score += 2;
      breakdown.push({ kind: "pos", text: `works with theory of change (+2)` });
    }
  }

  return { score, breakdown };
}

function rankedTools() {
  const withScores = TOOLS.map(t => {
    const { score, breakdown } = fitScore(t);
    return { ...t, _score: score, _breakdown: breakdown };
  });
  withScores.sort((a, b) => b._score - a._score || a.name.localeCompare(b.name));
  return withScores;
}

function maxPossibleScore() {
  const a = state.answers;
  let max = 0;
  if (a.purpose_primary) max += 4;
  max += a.purpose_secondary.length * 2;
  max += a.scope.length * 3;
  if (a.scale) max += 2;
  if (a.capacity) max += 2;
  if (a.approach) max += 1;
  if (a.data) max += 1;
  if (a.time) max += 1;
  if (a.toc === "have" || a.toc === "building") max += 2;
  return max;
}

function fitBand(score) {
  if (score >= 12) return "strong";
  if (score >= 6) return "possible";
  return "weak";
}

function fitPercent(score) {
  const max = maxPossibleScore();
  if (max === 0) return 0;
  return Math.round((score / max) * 100);
}

function requiredStagesDone() {
  return stageComplete(1) && stageComplete(2) && stageComplete(3);
}

// ============================================================
// RENDERING
// ============================================================
function render() {
  renderNav();
  renderStage();
}

function renderNav() {
  const nav = document.getElementById("stage-nav");
  const stages = [
    { n: 0, title: "Grounding", sub: "Country diagnostics" },
    { n: 1, title: "Purpose", sub: "Why you need M&E" },
    { n: 2, title: "Scope", sub: "What you're measuring" },
    { n: 3, title: "Scale & constraints", sub: "Where, with what" },
    { n: 4, title: "Your shortlist", sub: "Tools that support your design" }
  ];
  nav.innerHTML = `<div class="stage-nav-inner">${stages.map(s => {
    const isActive = state.stage === s.n;
    const isDone = stageComplete(s.n) && s.n !== 4 && s.n !== 0;
    const isStarted = stageStarted(s.n);
    let stateLabel = "not started";
    if (s.n === 0) stateLabel = stageStarted(0) ? "reviewed" : "optional";
    else if (isDone) stateLabel = "answered";
    else if (isStarted && !isDone) stateLabel = "in progress";
    else if (s.n === 4) stateLabel = requiredStagesDone() ? "ready" : "partial";
    return `<button class="stage-chip ${isActive ? 'active' : ''} ${isDone ? 'complete' : ''}" data-stage="${s.n}">
      <span class="mono">Stage ${String(s.n).padStart(2,'0')}</span>
      <span class="serif">${s.title}</span>
      <span class="state">${stateLabel}</span>
    </button>`;
  }).join("")}</div>`;
  nav.querySelectorAll(".stage-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      state.stage = parseInt(chip.dataset.stage);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function renderStage() {
  const c = document.getElementById("stage-container");
  if (state.stage === 0) renderStage0(c);
  else if (state.stage === 1) renderStage1(c);
  else if (state.stage === 2) renderStage2(c);
  else if (state.stage === 3) renderStage3(c);
  else if (state.stage === 4) renderStage4(c);
}

function stageBox({ stageN, stageTitle, steps, currentStep }) {
  return `<div class="stage-box">
    <div class="stage-box-header"><span>Stage</span><span>Steps</span></div>
    <div class="stage-box-stage"><strong>${stageN}. ${stageTitle}</strong></div>
    <div class="stage-box-steps"><ol>${steps.map((s, i) => `<li class="${i + 1 === currentStep ? 'current' : ''}">${s}</li>`).join("")}</ol></div>
  </div>`;
}

function navFooter({ canBack, stage }) {
  const isLast = stage === 4;
  const nextLabel = isLast ? "Refresh results" : (stage === 0 ? "Continue to Stage 1 →" : "Continue →");
  return `<div class="stage-footer">
    <button class="btn" id="btn-back" ${canBack ? '' : 'disabled'}>← Back</button>
    <div class="stage-footer-meta">Stage ${stage} of 4</div>
    <button class="btn primary" id="btn-next">${nextLabel}</button>
  </div>`;
}

function attachNav() {
  const back = document.getElementById("btn-back");
  const next = document.getElementById("btn-next");
  if (back) back.addEventListener("click", () => {
    if (state.stage > 0) { state.stage--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });
  if (next) next.addEventListener("click", () => {
    if (state.stage < 4) { state.stage++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else render();
  });
}

function labelFor(options, id) {
  if (!id) return null;
  const found = options.find(o => o.id === id);
  return found ? found.label : id;
}
function labelsFor(options, ids) {
  return (ids || []).map(id => labelFor(options, id)).filter(Boolean);
}

function renderStage4(c) {
  const ranked = rankedTools();
  const bands = { strong: [], possible: [], weak: [] };
  ranked.forEach(t => bands[fitBand(t._score)].push(t));

  // Cap strong band — but only when required stages complete, so we don't
  // inflate "strong" for users who've barely answered.
  const STRONG_CAP = 8;
  if (requiredStagesDone() && bands.strong.length > STRONG_CAP) {
    const overflow = bands.strong.slice(STRONG_CAP);
    bands.strong = bands.strong.slice(0, STRONG_CAP);
    bands.possible = [...overflow, ...bands.possible];
    bands.possible.sort((a, b) => b._score - a._score);
  }

  const incomplete = !requiredStagesDone();
  const missingStages = [
    stageComplete(1) ? null : { n: 1, name: "Stage 1 (purpose)" },
    stageComplete(2) ? null : { n: 2, name: "Stage 2 (scope)" },
    stageComplete(3) ? null : { n: 3, name: "Stage 3 (scale & capacity)" }
  ].filter(Boolean);

  const strongDesc = incomplete
    ? "Tools that match what you've told us so far. Answer the missing questions for a sharper list."
    : "Tools that fit the system you're describing. Treat as a starting shortlist, not a prescription — the right choice depends on your team, your data, and your country's existing systems.";
  const possibleDesc = incomplete
    ? "Tools that partially match what you've told us."
    : "Tools that partly fit. Often useful as complements — a participatory method alongside an indicator framework, or a global dataset to cross-check national data.";
  const weakDesc = incomplete
    ? "Not enough information yet to rank these. Answer the earlier questions."
    : "Tools included so you can see everything available. These usually serve a different purpose or scale than yours.";

  c.innerHTML = `

      copyBtn.innerHTML = '<span class="share-btn-icon">✓</span> Copied — paste anywhere';

      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); copyBtn.innerHTML = '<span class="share-btn-icon">✓</span> Copied'; }

      document.body.removeChild(ta);

  });

  const offlineBtn = document.getElementById("btn-save-offline");

    const stateJson = JSON.stringify(state).replace(/</g, "\\u003c");
    document.body.setAttribute("data-saved-state", stateJson);
    const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    document.body.removeAttribute("data-saved-state");
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "climate-me-navigator.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const original = offlineBtn.innerHTML;
    offlineBtn.innerHTML = '<span class="share-btn-icon">✓</span> Saved — open anytime, no internet needed';
    setTimeout(() => { offlineBtn.classList.remove("confirmed"); offlineBtn.innerHTML = original; }, 4000);
  });

  attachNav();
}

function buildPlainSummary() {
  const a = state.answers;
  const ranked = rankedTools();
  const strong = ranked.filter(t => fitBand(t._score) === "strong").slice(0, 8);
  const possible = ranked.filter(t => fitBand(t._score) === "possible").slice(0, 6);

  const L = [];
  L.push("CLIMATE M&E NAVIGATOR — YOUR SHORTLIST");
  L.push("Generated " + new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }));
  L.push("");
  L.push("YOUR ANSWERS");
  L.push("Primary purpose:   " + (labelFor(OPT_PURPOSE, a.purpose_primary) || "not answered"));
  if (a.purpose_secondary.length) L.push("Secondary:         " + labelsFor(OPT_PURPOSE, a.purpose_secondary).join(", "));
  L.push("Scope:             " + (a.scope.length ? labelsFor(OPT_SCOPE, a.scope).join(", ") : "not answered"));
  L.push("Scale:             " + (labelFor(OPT_SCALE, a.scale) || "not answered"));
  L.push("Capacity:          " + (labelFor(OPT_CAPACITY, a.capacity) || "not answered"));
  if (a.approach) L.push("Approach:          " + labelFor(OPT_APPROACH, a.approach));
  if (a.data) L.push("Data readiness:    " + labelFor(OPT_DATA, a.data));
  if (a.time) L.push("Time horizon:      " + labelFor(OPT_TIME, a.time));
  if (a.toc) L.push("Theory of change:  " + labelFor(OPT_TOC, a.toc));
  L.push("");

  if (strong.length) {
    L.push("STRONG FIT — start here");
    L.push("");
    strong.forEach((t, i) => {
      L.push(`${i + 1}. ${t.name}`);
      L.push(`   ${t.type} · ${t.provider} · ${t.cost}`);
      L.push(`   ${t.what}`);
      if (t.examples) L.push(`   In use: ${t.examples}`);
      L.push(`   Source: ${t.link}`);
      L.push("");
    });
  }

  if (possible.length) {
    L.push("POSSIBLE FIT — useful as complements");
    L.push("");
    possible.forEach((t, i) => {
      L.push(`${i + 1}. ${t.name}  (${t.provider})`);
      L.push(`   ${t.what}`);
      L.push(`   Source: ${t.link}`);
      L.push("");
    });
  }

  L.push("---");
  L.push("Generated by the Climate M&E Navigator " + VERSION + ".");
  L.push("Rankings reflect the answers above. The right M&E system is the one your");
  L.push("country can own, run, and learn from — tools support that, they do not define it.");
  return L.join("\n");
}

function renderBand(heading, cls, tools, desc) {
  if (tools.length === 0) {
    return `<div class="results-band">
      <div class="results-band-header">
        <h2 class="results-band-heading serif">${heading}</h2>
        <span class="results-band-count mono">0 tools</span>
        <span class="results-band-desc">${desc}</span>
      </div>
      <div style="padding:20px; color:var(--ink-muted); font-style:italic; font-size:13px; border:1px dashed var(--rule); border-radius:var(--radius);">
        No tools in this band given your answers.
      </div>
    </div>`;
  }
  return `<div class="results-band">
    <div class="results-band-header">
      <h2 class="results-band-heading serif">${heading}</h2>
      <span class="results-band-count mono">${tools.length} tool${tools.length === 1 ? '' : 's'}</span>
      <span class="results-band-desc">${desc}</span>
    </div>
    <div class="results-grid">
      ${tools.map(t => toolCardHTML(t, cls)).join("")}
    </div>
  </div>`;
}

function toolCardHTML(t, cls) {
  const breakdown = t._breakdown.map(b => `<li class="${b.kind}">${b.text}</li>`).join("");
  const positives = t._breakdown.filter(b => b.kind === "pos");
  const pct = fitPercent(t._score);
  let why = "";
  if (positives.length > 0) {
    why = `<div class="tool-card-why"><strong>Why this fits:</strong> ${positives.slice(0, 3).map(p => p.text.replace(/\s*\([+−]?\d+\)/, '')).join("; ")}.</div>`;
  } else if (cls === "weak") {
    const negatives = t._breakdown.filter(b => b.kind === "neg");
    if (negatives.length) {
      why = `<div class="tool-card-why"><strong>Why it ranks weak:</strong> ${negatives.slice(0, 2).map(p => p.text.replace(/\s*\([+−−]?\d+\)/, '')).join("; ")}.</div>`;
    }
  }
  const bandLabel = cls === "strong" ? "Strong" : (cls === "possible" ? "Possible" : "Weak");
  return `<article class="tool-card ${cls}">
    <div class="tool-card-fit-band" tabindex="0">
      ${bandLabel} · ${pct}%
      <div class="fit-tooltip">
        <div class="fit-tooltip-header">Why this score (${t._score} of ${maxPossibleScore()} possible)</div>
        <ul>${breakdown || '<li class="zero">Answer the questions to see how this ranks.</li>'}</ul>
      </div>
    </div>
    <div class="tool-card-name serif">${t.name}</div>
    <div class="tool-card-meta mono">${t.type}<span class="sep">·</span>${t.provider}</div>
    ${t.toc ? `<div class="tool-card-toc-badge">Works with theory of change</div>` : ''}
    <div class="tool-card-what">${t.what}</div>
    ${t.examples ? `<div class="tool-card-examples"><span class="tool-card-examples-label">In use:</span> ${t.examples}</div>` : ''}
    ${why}
    <div class="tool-card-footer">
      <span class="tool-card-cost">${t.cost}</span>
      <a class="tool-card-link" href="${t.link}" target="_blank" rel="noopener">Source →</a>
    </div>
  </article>`;
}

// ============================================================
// GLOSSARY
// ============================================================
const GLOSSARY = [
  { term: "Biennial Transparency Report", acronym: "BTR", def: "The main reporting document countries submit to the UNFCCC under the Paris Agreement, every two years. Covers GHG emissions, progress on NDC targets, climate impacts and adaptation, and finance received or provided. First BTRs were due by end of 2024." },
  { term: "Nationally Determined Contribution", acronym: "NDC", def: "A country's pledge under the Paris Agreement covering what it will do to reduce emissions and (often) how it will adapt. Updated every five years, with each update expected to be more ambitious than the last." },
  { term: "National Adaptation Plan", acronym: "NAP", def: "A country's medium-to-long-term strategy for adapting to climate change — identifying vulnerabilities, prioritising actions, and laying out implementation arrangements." },
  { term: "National Biodiversity Strategy and Action Plan", acronym: "NBSAP", def: "The country-level instrument for delivering on the UN Convention on Biological Diversity. Currently being updated to align with the Kunming-Montreal Global Biodiversity Framework adopted in 2022." },
  { term: "Country Climate and Development Report", acronym: "CCDR", def: "World Bank country-level diagnostic integrating climate action with development priorities. Typically 100-200 pages covering emissions pathways, climate risks, fiscal implications, and policy options. Useful as context for designing an M&E system, not as the M&E system itself." },
  { term: "Capacity-building Initiative for Transparency", acronym: "CBIT", def: "GEF funding mechanism designed to help developing countries build the institutional and technical capacity to meet Paris Agreement transparency requirements — including BTR-ready M&E systems. Often the funding source that lets countries take ownership of their reporting." },
  { term: "Measurement, Reporting and Verification", acronym: "MRV", def: "The standard process for tracking GHG emissions and reductions in a way that is credible to the UNFCCC and to funders. Measurement is collecting the data, reporting is putting it into the right format, and verification is independent checking that the numbers hold up." },
  { term: "Enhanced Transparency Framework", acronym: "ETF", def: "The Paris Agreement's reporting regime — the system that BTRs feed into. Replaced the older two-track system that gave developing countries lighter requirements; now everyone reports against the same template, with flexibility on detail for those that need it." },
  { term: "GHG inventory", acronym: "", def: "A systematic accounting of a country's (or city's, or company's) greenhouse gas emissions, broken down by sector and gas. The starting point for almost any mitigation work. Built using IPCC methodologies." },
  { term: "Sendai Framework", acronym: "", def: "The global agreement on disaster risk reduction (2015–2030). Has seven global targets countries report against — covering disaster mortality, affected populations, economic losses, damage to infrastructure, and the existence of national DRR strategies." },
  { term: "Voluntary National Review", acronym: "VNR", def: "A country's self-assessment of progress on the Sustainable Development Goals, presented at the UN's High-Level Political Forum. Both narrative and indicator-based; some countries integrate climate and biodiversity SDG reporting here." },
  { term: "Global Biodiversity Framework", acronym: "GBF", def: "The Kunming-Montreal Global Biodiversity Framework, adopted at CBD COP15 in 2022. Has 23 targets for 2030, including the well-known 30-by-30 target on protected areas. Comes with a monitoring framework of headline indicators." },
  { term: "Theory of change", acronym: "ToC", def: "A clear statement of how and why your activities are expected to lead to the outcomes you want — including the assumptions and intermediate steps along the way. Useful for M&E because it tells you what to measure and where to look for problems if things are not working." },
  { term: "Transformational change", acronym: "", def: "Systemic shifts in how a sector or society works — going beyond incremental improvement. Examples: shifting energy systems to renewables, reorganising land use, changing institutions and norms. Hard to measure with traditional logframes, which is why methods like Outcome Harvesting and Contribution Analysis appear in the toolkit." },
  { term: "Locally-led adaptation", acronym: "LLA", def: "An approach where decisions about adaptation are made by people most affected, with resources flowing to local institutions. Defined by eight principles agreed in 2021. Implies M&E approaches that capture local definitions of success, not just donor-set indicators." },
  { term: "National Implementing Entity", acronym: "NIE", def: "An in-country organisation accredited to receive climate finance directly (mainly under the Adaptation Fund and GCF), without going through a multilateral intermediary. Direct access matters for country ownership but comes with full reporting obligations." },
  { term: "AFOLU", acronym: "", def: "Agriculture, Forestry and Other Land Use — the IPCC's combined category for emissions and removals from land-based activities. Often the trickiest part of a national inventory, especially for forest-rich countries where REDD+ work overlaps." },
  { term: "Results framework", acronym: "", def: "A structured table laying out what a project or programme aims to achieve — typically with goals, outcomes, outputs, indicators, baselines, and targets. Most major climate funds (GCF, GEF, AF) have mandatory results frameworks projects must use." },
  { term: "Indicator", acronym: "", def: "A specific, measurable thing that tells you whether something is happening — like hectares of forest under improved management, or number of households with climate-resilient water supply. Good indicators are specific, relevant, and feasible to measure regularly." },
  { term: "Baseline", acronym: "", def: "The starting state against which change will be measured. Without a credible baseline, you cannot claim a project caused improvement — you do not know what was happening before. Establishing baselines is often half the work of designing M&E." },
  { term: "MEL", acronym: "", def: "Monitoring, Evaluation and Learning. The L matters: it is what distinguishes M&E that just produces reports from M&E that actually changes how a programme is run. Most modern frameworks emphasise MEL rather than M&E alone." },
  { term: "Loss and damage", acronym: "L&D", def: "The harms from climate change that go beyond what adaptation can prevent — including economic losses (damaged infrastructure, lost crops) and non-economic ones (cultural loss, displacement, ecosystem damage). A formal track under the UNFCCC since 2013, with the Loss and Damage Fund agreed at COP28." }
];

function openHelpDialog() {
  const existing = document.getElementById("help-dialog");
  if (existing) existing.remove();

  const dialog = document.createElement("div");
  dialog.id = "help-dialog";
  dialog.className = "feedback-dialog-backdrop";

  const glossaryHTML = GLOSSARY
    .slice()
    .sort((a, b) => a.term.localeCompare(b.term))
    .map(g => `
      <div class="glossary-item">
        <div class="glossary-term">
          ${g.term}
          ${g.acronym ? `<span class="glossary-term-acronym">${g.acronym}</span>` : ''}
        </div>
        <div class="glossary-def">${g.def}</div>
      </div>
    `).join("");

  dialog.innerHTML = `
    <div class="feedback-dialog-panel wide">
      <button class="feedback-dialog-close" id="help-close" aria-label="Close">×</button>
      <h3 class="feedback-dialog-title serif">Help &amp; glossary</h3>

      <div class="help-dialog-section">
        <h4>How to use this</h4>
        <p>Five stages, about three minutes if you skip the optional bits. <strong>Stage 0</strong> is grounding — country diagnostics worth reading before picking any tools. <strong>Stage 1</strong> asks why you need M&amp;E. <strong>Stage 2</strong> asks what you are measuring. <strong>Stage 3</strong> asks where you work and what resources you have. <strong>Stage 4</strong> shows a ranked shortlist of tools that fit your answers.</p>
        <p>You can <strong>jump between stages</strong> at any time using the bar at the top — your answers are kept. Required questions are marked, optional ones are clearly labelled. The more you answer, the sharper the shortlist gets.</p>
        <p>Stage 0 is fully skippable. Stages 1, 2, and 3 (required questions only) take about two minutes.</p>
      </div>

      <div class="help-dialog-section">
        <h4>What the rankings mean</h4>
        <p><strong>Strong fit</strong> are tools whose tagged purpose, scope, scale, and capacity overlap most with your answers. Start here — but do not treat them as a recommendation. Your context (country, donor, team, existing systems) matters more than the ranking.</p>
        <p><strong>Possible fit</strong> tools partly overlap. Often useful as complements to a strong-fit choice — for example, a participatory method paired with an indicator framework.</p>
        <p><strong>Weaker fit</strong> tools usually serve a different purpose or scale. Shown so you can see the full inventory; mostly safe to skip.</p>
        <p>Hover the "Strong / Possible / Weak" badge on any tool card to see exactly which of your answers pushed its score up or down, and the raw score versus what was possible. This is deliberately transparent — the logic can be debated and improved.</p>
      </div>

      <div class="help-dialog-section">
        <h4>Glossary of climate M&amp;E terms</h4>
        <p style="margin-bottom: 14px;">Brief plain-language definitions. Not exhaustive — just the terms you are most likely to bump into in tool descriptions and option labels.</p>
        <div class="glossary-list">
          ${glossaryHTML}
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(dialog);

  const close = () => dialog.remove();
  document.getElementById("help-close").addEventListener("click", close);
  dialog.addEventListener("click", (e) => { if (e.target === dialog) close(); });
  document.addEventListener("keydown", function escHandler(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", escHandler); }
  });
}

          <span class="feedback-dialog-btn-sub">opens in new tab</span>
        </a>
        <a class="feedback-dialog-btn" href="${mailtoUrl}">
          <span>Open default mail app</span>
          <span class="feedback-dialog-btn-sub">Outlook, Mail, Thunderbird etc</span>
        </a>
      </div>

      <div class="feedback-dialog-section">
        <p class="feedback-dialog-or">Or copy the message manually:</p>
        <div class="feedback-dialog-field">
          <label>Send to</label>
          <div class="feedback-dialog-copy-row">
            <input type="text" readonly value="${FEEDBACK_EMAIL}" id="fb-to-field" />
            <button class="feedback-dialog-copy-btn" data-copy="fb-to-field">Copy</button>
          </div>
        </div>
        <div class="feedback-dialog-field">
          <label>Subject</label>
          <div class="feedback-dialog-copy-row">
            <input type="text" readonly value="${subject}" id="fb-subj-field" />
            <button class="feedback-dialog-copy-btn" data-copy="fb-subj-field">Copy</button>
          </div>
        </div>
        <div class="feedback-dialog-field">
          <label>Message</label>
          <textarea readonly rows="8" id="fb-body-field">${body}</textarea>
          <button class="feedback-dialog-copy-btn full" data-copy="fb-body-field">Copy message</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(dialog);

  const close = () => dialog.remove();
  document.getElementById("fb-close").addEventListener("click", close);
  dialog.addEventListener("click", (e) => { if (e.target === dialog) close(); });
  document.addEventListener("keydown", function escHandler(e) {
    if (e.key === "Escape") { close(); document.removeEventListener("keydown", escHandler); }
  });

  dialog.querySelectorAll(".feedback-dialog-copy-btn").forEach(b => {
    b.addEventListener("click", async () => {
      const targetId = b.dataset.copy;
      const field = document.getElementById(targetId);
      const text = field.value;
      try { await navigator.clipboard.writeText(text); }
      catch { field.select(); try { document.execCommand("copy"); } catch (e) {} }
      const original = b.textContent;
      b.textContent = "Copied ✓";
      b.classList.add("confirmed");
      setTimeout(() => { b.textContent = original; b.classList.remove("confirmed"); }, 1800);
    });
  });
}

// ============================================================
// INIT
// ============================================================
const savedState = document.body.getAttribute("data-saved-state");
if (savedState) {
  try {
    const parsed = JSON.parse(savedState);
    if (parsed && parsed.answers) {
      Object.assign(state, parsed);
      document.body.removeAttribute("data-saved-state");
    }
  } catch (e) { /* malformed — start fresh */ }
}
render();
wireFeedbackButton();
wireHelpButton();
</script>

</body>
</html>
